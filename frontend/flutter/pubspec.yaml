name: otakuhub
description: "Private friend-group anime/manga/manhwa tracking and social platform."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # HTTP Client
  dio: ^5.7.0

  # Secure Storage (tokens)
  flutter_secure_storage: ^9.2.4

  # Local Preferences (settings)
  shared_preferences: ^2.3.5

  # Image Caching
  cached_network_image: ^3.4.1

  # Code Generation (freezed + json_serializable)
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Icons
  cupertino_icons: ^1.0.8

  # Design System — ADR 094
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  flutter_animate: ^4.5.2
  flutter_staggered_grid_view: ^0.7.0
  visibility_detector: ^0.4.0+2
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Mocking
  mocktail: ^1.0.4

  # Lints
  flutter_lints: ^6.0.0

  # Code Generators
  build_runner: ^2.4.14
  freezed: ^2.5.8
  json_serializable: ^6.9.4
  riverpod_generator: ^2.6.3

flutter:
  uses-material-design: true
