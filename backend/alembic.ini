# A generic, single database configuration.

[alembic]
# path to migration scripts
script_location = alembic

# template used to generate migration files
# file_template = %%(rev)s_%%(slug)s

# sys.path path, will be prepended to sys.path if present.
# defaults to the current working directory.
prepend_sys_path = .

# timezone to use when rendering the date within the migration file
# as well as the filename.
# If specified, requires the python-dateutil library that can be
# installed by adding `alembic[tz]` to the pip requirements
# timezone = 

# max length of character used for revision names. 
# Defaults to 40
# revision_length = 40

# set to 'true' to run the environment during 'alembic revision' 
# to load the environment
# environment = false

# set to 'true' to include a header to each migration script
# that includes the current revision
# include_header = true

# set to 'true' to have alembic print the SQL statements it executes to the console
# echo = false

# set to 'true' to print all statements as they're executed
# verbose = false

# set to 'true' to set the revision context to include the version table
# version_table = alembic_version

# set to 'true' to include the version table context
# version_table_schema = 

# set to 'true' to create the version table if it doesn't exist
# version_table_auto_create = true

# set to 'true' to set the revision context to include the environment
# environment = false

# set to 'true' to set the revision context to include the script directory
# script_directory = 

# set to 'true' to set the revision context to include the revision file
# revision_file = 

# set to 'true' to set the revision context to include the template
# template = 

# set to 'true' to set the revision context to include the current working directory
# cwd = 

# set to 'true' to set the revision context to include the database URL
# database_url = 