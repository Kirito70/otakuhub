[project]
name = "otakuhub-backend"
version = "0.1.0"
description = "Backend for OtakuHub - private friend-group anime/manga tracking platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.109.0,<1.0.0",
    "uvicorn[standard]>=0.24.0,<1.0.0",
    "sqlmodel>=0.0.26,<0.1.0",
    "asyncpg>=0.28.0,<1.0.0",
    "pydantic>=2.0.0,<3.0.0",
    "pydantic-settings>=2.0.0,<3.0.0",
    "python-jose>=1.7.0,<2.0.0",
    "passlib>=1.7.4,<2.0.0",
    "redis>=5.0.0,<6.0.0",
    "celery>=5.3.0,<6.0.0",
    "python-multipart>=0.0.6,<1.0.0",
    "httpx>=0.25.0,<1.0.0",
    "gunicorn>=21.2.0,<22.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "alembic>=1.17.0,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0,<8.0.0",
    "pytest-asyncio>=0.21.0,<1.0.0",
    "pytest-cov>=4.0.0,<5.0.0",
    "mypy>=1.0.0,<2.0.0",
    "ruff>=0.1.0,<1.0.0",
]

[build-system]

[tool.hatch.build]
targets.wheel = { packages = ["src"] }

requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
otakuhub-backend = "src.app.main:main"
