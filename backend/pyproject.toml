[project]
name = "otakuhub-backend"
version = "0.1.0"
description = "Backend for OtakuHub - private friend-group anime/manga tracking platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.109.0,<1.0.0",
    "uvicorn[standard]>=0.24.0,<1.0.0",
    "sqlmodel>=0.0.26,<0.1.0",
    "asyncpg>=0.28.0,<1.0.0",
    "pydantic>=2.0.0,<3.0.0",
    "pydantic-settings>=2.0.0,<3.0.0",
    "python-jose>=3.3.0,<4.0.0",
    "passlib[bcrypt]>=1.7.4,<2.0.0",
    "bcrypt>=4.0.1,<5.0.0",
    "redis>=5.0.0,<6.0.0",
    "celery>=5.3.0,<6.0.0",
    "python-multipart>=0.0.6,<1.0.0",
    "httpx>=0.25.0,<1.0.0",
    "gql>=3.5.0,<4.0.0",
    "aiohttp>=3.9.0,<4.0.0",
    "gunicorn>=21.2.0,<22.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "alembic>=1.17.0,<2.0.0",
    "typer>=0.12.0,<1.0.0",
    "apprise>=1.9.5,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0,<8.0.0",
    "pytest-asyncio>=0.21.0,<1.0.0",
    "pytest-cov>=4.0.0,<5.0.0",
    "mypy>=1.0.0,<2.0.0",
    "ruff>=0.1.0,<1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
targets.wheel = { packages = ["src"] }

[project.scripts]
otakuhub = "src.app.cli:main"
otakuhub-backend = "src.app.main:main"
otakuhub-dev = "src.app.run:main"

[tool.mypy]
files = ["src"]
strict = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "."
implicit_reexport = true

[[tool.mypy.overrides]]
module = [
    "src.app.routes.*",
    "src.app.services.*",
    "src.app.repositories.*",
    "src.app.external.*",
    "src.app.workers.*",
    "src.app.main",
    "src.app.sync.*",
    "src.app.commands.*",
    "src.app.core.*",
    "src.app.database",
    "src.app.schemas.*",
    "src.app.routers.*",
    "src.app.repositories.base_repository",
]
disable_error_code = [
    "attr-defined",
    "no-any-return",
    "arg-type",
    "union-attr",
    "call-overload",
    "no-untyped-def",
    "import-untyped",
    "untyped-decorator",
    "no-untyped-call",
    "return-value",
    "type-arg",
    "assignment",
    "call-arg",
    "valid-type",
    "var-annotated",
    "return",
    "unused-ignore",
    "import-not-found",
    "misc",
    "operator",
]

