version: '3.8'

services:
  # PostgreSQL database
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: otakuhub
      POSTGRES_USER: otakuhub
      POSTGRES_PASSWORD: otakuhub
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U otakuhub -d otakuhub"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis for caching and Celery
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Backend service (FastAPI)
  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://otakuhub:otakuhub@db:5432/otakuhub
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: test-secret-key-for-dev
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 15
      REFRESH_TOKEN_EXPIRE_DAYS: 30
      ANILIST_CLIENT_ID: test-anilist-client-id
      ANILIST_CLIENT_SECRET: test-anilist-client-secret
      MAL_CLIENT_ID: test-mal-client-id
      APPRISE_URLS: ""
      FRONTEND_URL: http://localhost:8080
      ALLOWED_ORIGINS: http://localhost:8080
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
    command: >
      sh -c "cd /app/backend &&
             pip install -e . &&
             alembic upgrade head &&
             python main.py"
    restart: unless-stopped

  # Celery worker for background tasks
  worker:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://otakuhub:otakuhub@db:5432/otakuhub
      REDIS_URL: redis://redis:6379/0
      ANILIST_CLIENT_ID: test-anilist-client-id
      ANILIST_CLIENT_SECRET: test-anilist-client-secret
      MAL_CLIENT_ID: test-mal-client-id
    volumes:
      - ./backend:/app/backend
    command: >
      sh -c "cd /app/backend &&
             pip install -e . &&
             celery -A workers.celery_app.celery_app worker --loglevel=info"
    restart: unless-stopped

volumes:
  postgres_data: